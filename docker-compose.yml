services:
  cali:
    build:
      context: .
    container_name: cali-app
    environment:
      - NODE_ENV=production
      - TZ=Australia/Brisbane
      - PORT=8080
      - PUBLIC_PORT=8082
      - DB_PATH=/data/cali-db.sqlite
    ports:
      - "8082:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - cali-prod

  sqlite-web-prod:
    image: coleifer/sqlite-web
    platform: linux/amd64 # Use amd64 with emulation if needed - sqlite-web doesn't have arm64 builds
    container_name: sqlite-web
    ports:
      - "8083:8081"
    volumes:
      - ./data:/data
    command: sqlite_web --host 0.0.0.0 --port 8081 /data/cali-db.sqlite
    restart: unless-stopped
    networks:
      - cali-prod

networks:
  cali-prod:
    driver: bridge
